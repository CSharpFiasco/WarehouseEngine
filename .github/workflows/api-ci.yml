name: API Build and Test

on:
  push:
    branches: [ main ]
    paths: 
      - '.github/workflows/api-ci.yml'
      - 'global.json'
      - 'src/WarehouseEngine.Api/**'
      - 'src/WarehouseEngine.Domain/**'
      - 'src/WarehouseEngine.Application/**'
      - 'src/WarehouseEngine.Infrastructure/**'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/api-ci.yml'
      - 'global.json'
      - 'src/WarehouseEngine.Api/**'
      - 'src/WarehouseEngine.Domain/**'
      - 'src/WarehouseEngine.Application/**'
      - 'src/WarehouseEngine.Infrastructure/**'

jobs:
  api-build-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
        
    - name: Restore API dependencies
      run: dotnet restore src/WarehouseEngine.Api/WarehouseEngine.Api.csproj -mt
      
    - name: Build API project
      run: dotnet build src/WarehouseEngine.Api/WarehouseEngine.Api.csproj --configuration Release --no-restore -mt
      
    - name: Run API-related tests
      run: |
        dotnet test --project tests/WarehouseEngine.Domain.Tests/WarehouseEngine.Domain.Tests.csproj --configuration Release -mt
        
    - name: Publish API
      run: dotnet publish src/WarehouseEngine.Api/WarehouseEngine.Api.csproj --configuration Release --no-build --output ./api-dist
      
    - name: Upload API artifacts
      uses: actions/upload-artifact@v4
      with:
        name: api-build
        path: ./api-dist/
        retention-days: 7