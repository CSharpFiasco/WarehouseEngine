name: Build Only

on:
  workflow_dispatch: # Manual trigger
  schedule:
    - cron: '0 2 * * *' # Daily at 2 AM UTC

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
        
    - name: Restore dependencies
      run: dotnet restore -mt
      
    - name: Build solution
      run: dotnet build --configuration Release --no-restore -mt
      
    - name: Build API project specifically
      run: dotnet build src/WarehouseEngine.Api/WarehouseEngine.Api.csproj --configuration Release --no-restore -mt
      
    - name: Check that API can be published
      run: dotnet publish src/WarehouseEngine.Api/WarehouseEngine.Api.csproj --configuration Release --no-build --output ./publish-output
      
    - name: List published files
      run: ls -la ./publish-output