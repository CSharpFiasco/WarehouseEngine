name: CI Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2025-latest
        env:
          SA_PASSWORD: YourStrong@Passw0rd
          ACCEPT_EULA: Y
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourStrong@Passw0rd -C -Q 'SELECT 1'"
          --health-interval=10s
          --health-timeout=3s
          --health-retries=3
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
        
    - name: Restore dependencies
      run: dotnet restore -mt
      
    - name: Build core projects (excluding Database project)
      run: |
        dotnet build -mt src/WarehouseEngine.Domain/WarehouseEngine.Domain.csproj --configuration Release --no-restore
        dotnet build -mt src/WarehouseEngine.Application/WarehouseEngine.Application.csproj --configuration Release --no-restore
        dotnet build -mt src/WarehouseEngine.Infrastructure/WarehouseEngine.Infrastructure.csproj --configuration Release --no-restore
        dotnet build -mt src/WarehouseEngine.Api/WarehouseEngine.Api.csproj --configuration Release --no-restore
        dotnet build -mt tests/WarehouseEngine.Domain.Tests/WarehouseEngine.Domain.Tests.csproj --configuration Release --no-restore
        dotnet build -mt tests/WarehouseEngine.Application.Tests/WarehouseEngine.Application.Tests.csproj --configuration Release --no-restore
        dotnet build -mt tests/WarehouseEngine.Api.Integration.Tests/WarehouseEngine.Api.Integration.Tests.csproj --configuration Release --no-restore
      
    - name: Run Domain tests
      run: dotnet test --project tests/WarehouseEngine.Domain.Tests/WarehouseEngine.Domain.Tests.csproj --configuration Release --no-build --coverlet --coverlet-output-format cobertura
      
    - name: Run Application tests (with SQL Server)
      run: dotnet test --project tests/WarehouseEngine.Application.Tests/WarehouseEngine.Application.Tests.csproj --configuration Release --no-build --coverlet --coverlet-output-format cobertura
      env:
        ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=WarehouseEngineTest;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=true;"
      
    - name: Run API Integration tests
      run: dotnet test --project tests/WarehouseEngine.Api.Integration.Tests/WarehouseEngine.Api.Integration.Tests.csproj --configuration Release --no-build --coverlet --coverlet-output-format cobertura
      continue-on-error: true  # Allow this to fail if Docker is not available
      
    - name: Publish API
      run: dotnet publish src/WarehouseEngine.Api/WarehouseEngine.Api.csproj --configuration Release --no-build --output ./api-publish

  # Alternative job for environments without services support
  build-basic:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
        
    - name: Restore dependencies
      run: dotnet restore -mt
      
    - name: Build core projects only
      run: |
        dotnet build -mt src/WarehouseEngine.Domain/WarehouseEngine.Domain.csproj --configuration Release --no-restore
        dotnet build -mt src/WarehouseEngine.Application/WarehouseEngine.Application.csproj --configuration Release --no-restore
        dotnet build -mt src/WarehouseEngine.Infrastructure/WarehouseEngine.Infrastructure.csproj --configuration Release --no-restore
        dotnet build -mt src/WarehouseEngine.Api/WarehouseEngine.Api.csproj --configuration Release --no-restore
        dotnet build -mt tests/WarehouseEngine.Domain.Tests/WarehouseEngine.Domain.Tests.csproj --configuration Release --no-restore
      
    - name: Run Domain tests only (basic build)
      run: dotnet test -mt --project tests/WarehouseEngine.Domain.Tests/WarehouseEngine.Domain.Tests.csproj --configuration Release --no-build
