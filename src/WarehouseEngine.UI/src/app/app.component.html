<app-top-nav></app-top-nav>
@if (loginStatus() == null || loginStatus() === 'logging in') {
<mat-spinner></mat-spinner>
}
@else if (loginStatus() === 'logged out') {
  <app-login></app-login>
}
@else if (loginStatus() === 'logged in') {
  <app-sidenav>
    <router-outlet></router-outlet>
  </app-sidenav>
}
