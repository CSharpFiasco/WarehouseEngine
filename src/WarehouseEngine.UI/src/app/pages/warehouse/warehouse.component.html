<h2>Warehouses</h2>

@if (isLoading()) {
  <mat-spinner></mat-spinner>
}
@else if (error(); as err) {
  <p class="warehouse-error">{{ err }}</p>
}
@else {
  <table mat-table class="mat-elevation-z2 warehouse-table" [dataSource]="warehouses()">
    <ng-container matColumnDef="id">
      <th *matHeaderCellDef mat-header-cell>Id</th>
      <td *matCellDef="let warehouse" mat-cell>{{ warehouse.id }}</td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th *matHeaderCellDef mat-header-cell>Name</th>
      <td *matCellDef="let warehouse" mat-cell>{{ warehouse.name }}</td>
    </ng-container>

    <tr *matHeaderRowDef="displayedColumns" mat-header-row></tr>
    <tr *matRowDef="let row; columns: displayedColumns" mat-row></tr>
  </table>
}
